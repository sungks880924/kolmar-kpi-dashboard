<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무석콜마 연구소 KPI 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Malgun Gothic','맑은 고딕',Arial,sans-serif}
body{background:#f0f2f5;min-height:100vh;padding:16px}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f0f2f5;position:fixed;top:0;left:0;width:100%;z-index:999}
.login-box{background:#fff;border-radius:16px;padding:40px 48px;box-shadow:0 4px 24px rgba(0,0,0,0.10);width:340px;text-align:center}
.login-logo{background:#001F5B;border-radius:10px;padding:10px 20px;display:inline-block;margin-bottom:20px}
.login-logo span{color:#C9A84C;font-size:15px;font-weight:700;letter-spacing:.04em}
.login-box h2{font-size:16px;font-weight:600;color:#1a1a2e;margin-bottom:6px}
.login-box p{font-size:12px;color:#999;margin-bottom:24px}
.login-box input{width:100%;padding:10px 14px;border:1px solid #dde2ee;border-radius:8px;font-size:14px;outline:none;margin-bottom:12px;font-family:inherit}
.login-box input:focus{border-color:#001F5B}
.login-box button{width:100%;padding:10px;background:#001F5B;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.login-box button:hover{background:#0a2d7a}
.login-err{color:#e24b4a;font-size:12px;margin-top:8px;display:none}
#dashboard{display:none}
.db{max-width:1200px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.topbar{background:#001F5B;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.topbar .ttl{font-size:16px;font-weight:600;color:#fff}
.topbar .sub{font-size:11px;color:rgba(255,255,255,.6)}
.logout-btn{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
.logout-btn:hover{background:rgba(255,255,255,.25)}
.upload-bar{background:#E8EDF7;border-bottom:1px solid #d0d8ee;padding:10px 20px;display:flex;align-items:center;gap:12px}
.upload-btn{background:#001F5B;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit}
.upload-btn:hover{background:#0a2d7a}
.upload-zone{border:2px dashed #aab8d8;border-radius:8px;padding:8px 16px;font-size:12px;color:#557;cursor:pointer;flex:1;text-align:center;transition:border-color .2s}
.upload-zone.drag{border-color:#001F5B;background:#dce6f5}
.upload-status{font-size:11px;color:#0F6E56;font-weight:600}
.body{display:grid;grid-template-columns:160px 1fr}
.sidebar{background:#f8f9fc;border-right:1px solid #e8eaf0;padding:14px 12px}
.slbl{font-size:10px;font-weight:600;color:#888;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;margin-top:14px}
.slbl:first-child{margin-top:0}
.sitem{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;font-size:12px;color:#444;cursor:pointer;user-select:none;transition:background .15s}
.sitem:hover{background:#eef0f7}
.sitem.active{background:#dce6f5;color:#001F5B;font-weight:600}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.content{padding:14px 16px;background:#fff}
.krow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kcard{background:#f8f9fc;border-radius:8px;padding:12px 14px;border:1px solid #eef0f5}
.klbl{font-size:11px;color:#888;margin-bottom:3px}
.kval{font-size:22px;font-weight:600;color:#1a1a2e;line-height:1.1}
.ksub{font-size:10px;color:#0F6E56;margin-top:3px}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.cc{border:1px solid #eef0f5;border-radius:10px;padding:12px 14px}
.ctitle{font-size:12px;font-weight:600;color:#333;margin-bottom:10px}
.yearcc{border:1px solid #eef0f5;border-radius:10px;padding:12px 14px}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:#666}
.legsq{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.footer{text-align:center;padding:8px;font-size:10px;color:#bbb;border-top:1px solid #eef0f5;margin-top:12px}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><span>无锡科玛 · 무석콜마</span></div>
    <h2>연구소 KPI 대시보드</h2>
    <p>접근하려면 비밀번호를 입력하세요</p>
    <input type="password" id="pw-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">로그인</button>
    <div class="login-err" id="pw-err">비밀번호가 올바르지 않습니다</div>
  </div>
</div>

<!-- 대시보드 -->
<div id="dashboard">
<div class="db">
  <div class="topbar">
    <div>
      <div class="ttl">무석콜마 연구소 KPI 대시보드</div>
      <div class="sub" id="data-range">데이터를 업로드해주세요</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="upload-status" id="upload-status"></div>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>
  <div class="upload-bar">
    <button class="upload-btn" onclick="document.getElementById('file-input').click()">엑셀 파일 업로드</button>
    <div class="upload-zone" id="drop-zone"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="handleDrop(event)">
      여기에 엑셀 파일을 드래그하거나 위 버튼을 클릭하세요 (.xlsx)
    </div>
    <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this.files[0])">
  </div>
  <div class="body">
    <div class="sidebar">
      <div class="slbl">기간</div>
      <div id="year-filters"><div class="sitem active" onclick="setFilter('year','전체',this)">전체</div></div>
      <div class="slbl">센터</div>
      <div id="center-filters"><div class="sitem active" onclick="setFilter('center','전체',this)">전체</div></div>
      <div class="slbl">팀</div>
      <div id="team-filters"><div class="sitem active" onclick="setFilter('team','전체',this)">전체</div></div>
    </div>
    <div class="content">
      <div class="krow">
        <div class="kcard"><div class="klbl">총 매출액</div><div class="kval" id="k-sales">-</div><div class="ksub" id="k-sales-sub">-</div></div>
        <div class="kcard"><div class="klbl">총 개발대응건수</div><div class="kval" id="k-dev">-</div><div class="ksub" id="k-dev-sub">-</div></div>
        <div class="kcard"><div class="klbl">약호연결건수</div><div class="kval" id="k-link">-</div><div class="ksub" id="k-link-sub">-</div></div>
        <div class="kcard"><div class="klbl">평균 FIX율</div><div class="kval" id="k-fix">-</div><div class="ksub" id="k-fix-sub">-</div></div>
      </div>
      <div class="charts-row">
        <div class="cc"><div class="ctitle">팀별 개발대응건수</div><div style="position:relative;height:240px"><canvas id="c-dev" role="img" aria-label="팀별 개발대응건수">팀별 개발대응건수</canvas></div></div>
        <div class="cc"><div class="ctitle">팀별 평균 FIX율 (%)</div><div style="position:relative;height:240px"><canvas id="c-fix" role="img" aria-label="팀별 FIX율">팀별 FIX율</canvas></div></div>
      </div>
      <div class="yearcc">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div class="ctitle" style="margin:0">연도별 센터 매출 추이</div>
          <div class="legend" id="year-legend"></div>
        </div>
        <div style="position:relative;height:180px"><canvas id="c-year" role="img" aria-label="연도별 센터 매출">연도별 매출</canvas></div>
      </div>
      <div class="footer" id="footer-txt">무석콜마(无锡科玛) 효능평가센터</div>
    </div>
  </div>
</div>
</div>

<script>
const PW = 'zhfakdusrnth123';
const CENTER_COLORS = {'UV기술센터':'#185FA5','스킨케어센터':'#1D9E75','메이크업센터':'#BA7517'};
let RAW = [];
const state = {year:'전체',center:'전체',team:'전체'};
let chartDev, chartFix, chartYear;

function checkPw() {
  const val = document.getElementById('pw-input').value;
  if (val === PW) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initCharts();
  } else {
    document.getElementById('pw-err').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

function logout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-err').style.display = 'none';
}

function initCharts() {
  if (chartDev) return;
  const hbar = {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},indexAxis:'y',scales:{x:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:10}}},y:{grid:{display:false},ticks:{font:{size:10}}}}};
  chartDev = new Chart(document.getElementById('c-dev'),{type:'bar',data:{labels:[],datasets:[{data:[],backgroundColor:'#378ADD',borderRadius:3,borderWidth:0}]},options:hbar});
  chartFix = new Chart(document.getElementById('c-fix'),{type:'bar',data:{labels:[],datasets:[{data:[],backgroundColor:'#C9A84C',borderRadius:3,borderWidth:0}]},options:hbar});
  chartYear = new Chart(document.getElementById('c-year'),{type:'bar',data:{labels:[],datasets:[]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,grid:{color:'rgba(0,0,0,0.04)'},ticks:{callback:v=>v+'억',font:{size:10}}}}}});
}

function excelDateToStr(v) {
  if (typeof v==='string'&&v.match(/^\d{4}-\d{2}/)) return v.substring(0,7);
  if (typeof v==='number') { const d=new Date(Math.round((v-25569)*864e5)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  if (v instanceof Date) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0');
  return String(v).substring(0,7);
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
}

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result,{type:'array',cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      processData(XLSX.utils.sheet_to_json(ws,{raw:false}), file.name);
    } catch(err) { alert('파일 오류: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function processData(json, filename) {
  RAW = [];
  json.forEach(row => {
    const 센터=row['센터']||''; const 팀=row['팀']||'';
    const 년월=excelDateToStr(row['년월']||'');
    const 년도=년월.substring(0,4);
    const 매출=parseFloat(row['매출액']||0)||0;
    const 개발=parseFloat(row['개발대응건수']||0)||0;
    const 약호=parseFloat(row['약호연결건수']||0)||0;
    const fixRaw=parseFloat(row['FIX율(%)']||row['FIX율']||0)||0;
    const fix=fixRaw>1?fixRaw:fixRaw*100;
    if (센터&&팀&&년도) RAW.push({센터,팀,년월,년도,매출,개발,약호,fix});
  });
  if (!RAW.length) { alert('데이터를 읽을 수 없습니다.'); return; }

  document.getElementById('upload-status').textContent = filename+' ✓ '+RAW.length+'행';
  const years=[...new Set(RAW.map(d=>d.년도))].sort();
  const centers=[...new Set(RAW.map(d=>d.센터))].sort();
  const teams=[...new Set(RAW.map(d=>d.팀))].sort();
  const minD=RAW.map(d=>d.년월).sort()[0];
  const maxD=RAW.map(d=>d.년월).sort().reverse()[0];
  document.getElementById('data-range').textContent=minD+' – '+maxD+' · '+centers.length+'개 센터 · '+teams.length+'개 팀';
  document.getElementById('footer-txt').textContent='무석콜마(无锡科玛) 효능평가센터 · 데이터: '+minD+' – '+maxD;

  const yf=document.getElementById('year-filters');
  yf.innerHTML='<div class="sitem active" onclick="setFilter(\'year\',\'전체\',this)">전체</div>';
  years.reverse().forEach(y=>{ yf.innerHTML+=`<div class="sitem" onclick="setFilter('year','${y}',this)">${y}</div>`; });

  const cf=document.getElementById('center-filters');
  cf.innerHTML='<div class="sitem active" onclick="setFilter(\'center\',\'전체\',this)">전체</div>';
  centers.forEach(c=>{ const col=CENTER_COLORS[c]||'#888'; cf.innerHTML+=`<div class="sitem" onclick="setFilter('center','${c}',this)"><span class="sdot" style="background:${col}"></span>${c}</div>`; });

  const tf=document.getElementById('team-filters');
  tf.innerHTML='<div class="sitem active" onclick="setFilter(\'team\',\'전체\',this)">전체</div>';
  teams.forEach(t=>{ tf.innerHTML+=`<div class="sitem" onclick="setFilter('team','${t}',this)" style="font-size:11px">${t}</div>`; });

  document.getElementById('year-legend').innerHTML=centers.map(c=>`<div class="leg"><span class="legsq" style="background:${CENTER_COLORS[c]||'#888'}"></span>${c}</div>`).join('');
  state.year='전체'; state.center='전체'; state.team='전체';
  update();
}

function filtered() {
  return RAW.filter(d=>(state.year==='전체'||d.년도===state.year)&&(state.center==='전체'||d.센터===state.center)&&(state.team==='전체'||d.팀===state.team));
}

function fmt억(v) {
  if(v>=1e8) return (v/1e8).toFixed(1)+'억';
  if(v>=1e4) return Math.round(v/1e4)+'만';
  return Math.round(v).toLocaleString();
}

function update() {
  if (!RAW.length) return;
  const data=filtered();
  const sales=data.reduce((s,d)=>s+d.매출,0);
  const dev=data.reduce((s,d)=>s+d.개발,0);
  const link=data.reduce((s,d)=>s+d.약호,0);
  const fix=data.length?data.reduce((s,d)=>s+d.fix,0)/data.length:0;
  document.getElementById('k-sales').textContent=fmt억(sales);
  document.getElementById('k-sales-sub').textContent='전체 매출 합계';
  document.getElementById('k-dev').textContent=dev.toLocaleString();
  document.getElementById('k-dev-sub').textContent='월 평균 '+Math.round(dev/Math.max([...new Set(data.map(d=>d.년월))].length,1))+'건';
  document.getElementById('k-link').textContent=link.toLocaleString();
  document.getElementById('k-link-sub').textContent='개발 대비 '+((link/(dev||1))*100).toFixed(1)+'%';
  document.getElementById('k-fix').textContent=fix.toFixed(1)+'%';
  document.getElementById('k-fix-sub').textContent='팀별 평균 FIX율';

  const teams=[...new Set(RAW.map(d=>d.팀))].sort();
  const devS=teams.map((t,i)=>({t,v:data.filter(d=>d.팀===t).reduce((s,d)=>s+d.개발,0)})).sort((a,b)=>b.v-a.v);
  const fixS=teams.map(t=>{const td=data.filter(d=>d.팀===t);return{t,v:td.length?+(td.reduce((s,d)=>s+d.fix,0)/td.length).toFixed(1):0};}).sort((a,b)=>b.v-a.v);

  chartDev.data.labels=devS.map(d=>d.t); chartDev.data.datasets[0].data=devS.map(d=>d.v); chartDev.update();
  chartFix.data.labels=fixS.map(d=>d.t); chartFix.data.datasets[0].data=fixS.map(d=>d.v); chartFix.update();

  const years=[...new Set(RAW.map(d=>d.년도))].sort();
  const centers=[...new Set(RAW.map(d=>d.센터))].sort();
  chartYear.data.labels=years;
  chartYear.data.datasets=centers.map(c=>({label:c,data:years.map(y=>+(data.filter(d=>d.센터===c&&d.년도===y).reduce((s,d)=>s+d.매출,0)/1e8).toFixed(1)),backgroundColor:CENTER_COLORS[c]||'#888',borderWidth:0}));
  chartYear.update();
}

function setFilter(type,val,el) {
  state[type]=val;
  el.parentElement.querySelectorAll('.sitem').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  update();
}
</script>
</body>
</html>
